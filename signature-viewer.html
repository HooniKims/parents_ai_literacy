<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>서명 복원 도구 | 등촌중학교</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="assets/images/school-logo.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="signature-viewer.css" />
  </head>
  <body>
    <main class="viewer-shell">
      <section class="viewer-panel">
        <div class="viewer-head">
          <img src="assets/images/school-logo.png" alt="등촌중학교 로고" width="72" height="72" />
          <div>
            <p class="eyebrow">Admin tool</p>
            <h1>서명 이미지 복원</h1>
            <p>
              Google Sheets의 서명이미지 셀 값을 붙여넣으면 PNG 이미지로 확인할 수 있습니다.
            </p>
          </div>
        </div>

        <label class="field">
          <span>서명이미지 데이터</span>
          <textarea
            data-signature-source
            placeholder="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..."
          ></textarea>
        </label>

        <div class="actions">
          <button class="button button-primary" type="button" data-render>이미지 복원</button>
          <button class="button button-subtle" type="button" data-clear>지우기</button>
          <a class="button button-ghost is-disabled" data-download download="signature.png">
            PNG 다운로드
          </a>
        </div>

        <p class="message" data-message role="status" aria-live="polite"></p>

        <div class="preview-box">
          <img data-preview alt="복원된 서명 이미지" hidden />
          <p data-empty>복원된 서명이 이 영역에 표시됩니다.</p>
        </div>
      </section>
    </main>

    <script src="signature-viewer.js"></script>
  </body>
</html>
